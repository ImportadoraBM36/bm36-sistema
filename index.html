<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - BM36</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./site/login.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">

                <img
                    src="./imagem/logo2.jpg"
                    alt="BM36"
                >

            </div>


            <div class="login-title">

                <h1>
                    Bem-vindo
                </h1>

                <p>
                    Entre com sua conta para acessar o sistema.
                </p>

            </div>


            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@empresa.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="senha">
                        Senha
                    </label>


                    <div class="password-wrap">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div
                    class="login-error"
                    id="loginError"
                >
                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Entrar
                </button>

            </form>

        </section>

    </main>


    <script src="./site/login.js"></script>

</body>

</html>
